dataObjects {

  ext-osm-track {
    type = JsonFileDataObject
    path = ${env.inputPath}"/osm/"${parameters.osmConfig.region}"-railway-tracks.jsons"
    schema = "caseClass#ch.zzeekk.mars.osm.RawEntry"
    jsonOptions = {
      mode = FAILFAST
      multiline = false
    }
    metadata.description = """
      OSM railway tracks, extracted from the dump downloaded from  https://download.geofabrik.de/europe and preprocessed using osmium.
      See https://taginfo.geofabrik.de/ for more informations about used properties.
    """
  }

  ext-osm-switch {
    type = JsonFileDataObject
    path = ${env.inputPath}"/osm/"${parameters.osmConfig.region}"-railway-switches.jsons"
    schema = "caseClass#ch.zzeekk.mars.osm.RawEntry"
    jsonOptions = {
      mode = FAILFAST
      multiline = false
    }
    metadata.description = """
      OSM railway switches, extracted from the dump downloaded from  https://download.geofabrik.de/europe and preprocessed using osmium.
      See https://taginfo.geofabrik.de/ for more informations about used properties.
    """
  }

  slv-osm-track = ${templates.slvTable} {
    path = osm_track
  }

  slv-osm-switch = ${templates.slvTable} {
    path = osm_switch
  }

  slv-osm-edge = ${templates.slvTable} {
    path = osm_edge
  }

  slv-osm-node = ${templates.slvTable} {
    path = osm_node
  }

  slv-osm-pp = ${templates.slvTable} {
    path = osm_pp
    schema = "caseClass#ch.zzeekk.mars.pp.RawPpWithMapping"
  }

  gld-osm-node-fgb = {
    type = ch.zzeekk.mars.pp.FlatGeobufDataObject
    localPath = "./data/gld/geometries/"${parameters.countryCode}"-osm-node.fgb"
    path = ${env.geometriesPath}/${parameters.countryCode}"-osm-node.fgb"
  }

  gld-osm-edge-fgb = {
    type = ch.zzeekk.mars.pp.FlatGeobufDataObject
    localPath = "./data/gld/geometries/"${parameters.countryCode}"-osm-edge.fgb"
    path = ${env.geometriesPath}/${parameters.countryCode}"-osm-edge.fgb"
    colsToIgnore = [tracks]
  }

  gld-osm-line-fgb = {
    type = ch.zzeekk.mars.pp.FlatGeobufDataObject
    geometryType = "MultiLineString"
    localPath = "./data/gld/geometries/"${parameters.countryCode}"-osm-line.fgb"
    path = ${env.geometriesPath}/${parameters.countryCode}"-osm-line.fgb"
  }

}

actions {

  load-slv-osm-track {
    type = CopyAction
    inputId = ext-osm-track
    outputId = slv-osm-track
    transformers = [{
      type = SQLDfTransformer
      code = """
        SELECT
          udfUuidFromLong(properties['@id'] ) as uuid,
          properties['@id'] as id,
          from_json(properties['@way_nodes'], 'array<long>') node_ids,
          ST_GeomFromGeoJSON(geometry) geometry,
          properties.railway as type,
          properties.ref as ref,
          properties.track_ref as track_ref,
          properties['railway:preferred_direction'] as preferred_direction,
          properties.usage = 'main' as main,
          properties.maxspeed,
          properties.operator,
          coalesce(properties.bridge = 'yes', false) as bridge,
          coalesce(properties.tunnel = 'yes', false) as tunnel
        FROM %{inputViewName}
      """
    }, {
      type = ScalaClassSparkDfTransformer
      className = ch.zzeekk.mars.pp.CrsTransformer
      options {
        srcCrs = "EPSG:4326"
        tgtCrs = ${parametersDE.defaultSrcCrs}
      }
      description = "ORM data is always in EPSG:4326, which is not a metric CRS. We transform geometries to a local metric CRS for distance calculations."
    }]
    metadata.feed = osm
  }


  load-slv-osm-switch {
    type = CopyAction
    inputId = ext-osm-switch
    outputId = slv-osm-switch
    transformers = [{
      type = SQLDfTransformer
      code = """
        SELECT
          udfUuidFromLong(properties['@id']) as uuid,
          properties['@id'] as id,
          ST_GeomFromGeoJSON(geometry) geometry,
          properties.ref,
          properties.operator,
          properties['railway:turnout_side'] as turnout_side,
          properties['railway:maxspeed:diverging'] as maxspeed_diverging,
          properties['railway:maxspeed:straight'] as maxspeed_straight,
          properties['railway:radius'] as radius
        FROM %{inputViewName}
      """
    }, {
      type = ScalaClassSparkDfTransformer
      className = ch.zzeekk.mars.pp.CrsTransformer
      options {
        srcCrs = "EPSG:4326"
        tgtCrs = ${parametersDE.defaultSrcCrs}
      }
      description = "ORM data is always in EPSG:4326, which is not a metric CRS. We transform geometries to a local metric CRS for distance calculations."
    }]
    metadata.feed = osm
  }

  create-slv-osm-edge {
    type = CustomDataFrameAction
    inputIds = [slv-osm-track, slv-osm-switch]
    outputIds = [slv-osm-edge]
    transformers = [{
      type = ScalaClassSparkDfsTransformer
      className = ch.zzeekk.mars.osm.OsmTrackTransformer
      overrideOutputId = track
    }, {
      type = ScalaClassSparkDfsTransformer
      className = ch.zzeekk.mars.pp.EdgeTransformer
      options = {
        srcCrs = ${parameters.defaultSrcCrs}
        tagsToIgnore = "bridge, tunnel"
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = osm
  }

  create-slv-osm-node {
    type = CustomDataFrameAction
    inputIds = [slv-osm-edge, slv-osm-switch]
    outputIds = [slv-osm-node]
    transformers = [{
      type = ScalaClassSparkDfsTransformer
      className = ch.zzeekk.mars.osm.OsmSwitchTransformer
      overrideOutputId = switch
    }, {
      type = ScalaClassSparkDfsTransformer
      className = ch.zzeekk.mars.pp.NodeTransformer
      renamedInputIds = {
        slv-osm-edge: edge
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = osm
  }

  create-slv-osm-pp {
    type = CustomDataFrameAction
    inputIds = [slv-osm-edge, slv-osm-node]
    outputIds = [slv-osm-pp]
    transformers = [{
      type = ScalaClassSparkDfsTransformer
      className = ch.zzeekk.mars.pp.CreatePpTransformer
      renamedInputIds = {
        slv-osm-edge = edge
        slv-osm-node = node
      }
      options = {
        srcCrs = ${parameters.defaultSrcCrs}
        nbOfPartitions = ${?parameters.osmConfig.nbOfPartitions}
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = osm
  }

  load-gld-osm-line-fgb {
    type = CopyAction
    inputId = ext-osm-track
    outputId = gld-osm-line-fgb
    transformers = [{
      type = ScalaClassSparkDfTransformer
      className = ch.zzeekk.mars.osm.OsmExtractMainRailwayLinesTransformer
      options = {
        operators = ${?parameters.osmConfig.lineExtract.operators}
        linesToExclude = ${?parameters.osmConfig.lineExtract.linesToExclude}
      }
    }]
    metadata.feed = osm-line
  }

}