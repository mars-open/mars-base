// chosen parameter config in global.conf!
parametersDE {
  countryCode = "de"
  defaultSrcCrs = "EPSG:4326" // standard for OSM data
  topology = "osm"
  osmConfig {
    region = "germany"
    lineExtract = {
      #operators = "DB"
      #linesToExclude = "300,302"
    }
  }
}

dataObjects {

  slv-de-pp-mapping-osm = {
    type = DeltaLakeTableDataObject
    table = {
      db = default
      name = slv_de_pp_mapping_osm
    }
    path = "./data/slv/de_pp_mapping_osm"
  }

  gld-de-edge = {
    type = RawFileDataObject
    path = "./data/gld/de-edge"
    customFormat = geoparquet
  }

  gld-de-edge-fgb = {
    type = ch.zzeekk.mars.pp.FlatGeobufDataObject
    localPath = "./data/gld/geometries/de-edges.fgb"
    path = ${env.geometriesPath}"/de-edges.fgb"
    colsToIgnore = [tracks]
  }

  gld-de-node = {
    type = RawFileDataObject
    path = "./data/gld/de-node"
    customFormat = geoparquet
  }

  gld-de-node-fgb = {
    type = ch.zzeekk.mars.pp.FlatGeobufDataObject
    localPath = "./data/gld/geometries/de-nodes.fgb"
    path = ${env.geometriesPath}"/de-nodes.fgb"
    geometryType = Point
    #idColName = uuid_node # doesnt work in version 33.1, lets put it as attribute
    colsToIgnore = [edges]
    ogr2OgrFix = true # otherwise error "start offset of Float64Array should be a multiple of 8" might occur in JS clients...
  }

  gld-de-pp-raw-pmtiles = {
    type = ch.zzeekk.mars.pp.PMTilesDataObject
    localPath = "./data/gld/geometries/de-pp-raw.pmtiles"
    path = ${env.geometriesPath}"/de-pp-raw.pmtiles"
    compressTiles = false
    zoomAndFilter = {
      15 = "zoom <= 1"
      18 = "zoom <= 2"
      21 = "zoom <= 3"
    }
  }

  gld-de-pp = {
    type = RawFileDataObject
    path = "./data/gld/de-pp"
    customFormat = geoparquet
  }

  gld-de-pp-pmtiles = {
    type = ch.zzeekk.mars.pp.PMTilesDataObject
    localPath = "./data/gld/geometries/de-pp.pmtiles"
    path = ${env.geometriesPath}"/de-pp.pmtiles"
    compressTiles = false
    zoomAndFilter = {
      15 = "zoom <= 1"
      18 = "zoom <= 2"
      21 = "zoom <= 3"
    }
  }

}

actions {

  create-slv-de-pp {
    type = CustomDataFrameAction
    inputIds = [slv-osm-pp]
    outputIds = [slv-pp, slv-de-pp-mapping-osm]
    recursiveInputIds = [slv-pp]
    transformers = [{
      type = ScalaClassSparkDfsTransformer
      className = ch.zzeekk.mars.pp.SnapPpTransformer
      options = {
        srcCrs = ${parametersDE.defaultSrcCrs}
      }
      renamedInputIds = {
        slv-osm-pp: pp-input
      }
      renamedOutputIds = {
        slv-pp-mapping: slv-de-pp-mapping-osm
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-edge {
    type = CopyAction
    inputId = slv-osm-edge
    outputId = gld-de-edge
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-node {
    type = CopyAction
    inputId = slv-osm-node
    outputId = gld-de-node
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-edge-fgb {
    type = CopyAction
    inputId = slv-osm-edge
    outputId = gld-de-edge-fgb
    transformers = [{
      type = ScalaClassSparkDfTransformer
      className = ch.zzeekk.mars.pp.CrsTransformer
      options {
        srcCrs = ${parametersDE.defaultSrcCrs}
        tgtCrs = "EPSG:4326"
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-node-fgb {
    type = CopyAction
    inputId = slv-osm-node
    outputId = gld-de-node-fgb
    transformers = [{
      type = ScalaClassSparkDfTransformer
      className = ch.zzeekk.mars.pp.CrsTransformer
      options {
        srcCrs = ${parametersDE.defaultSrcCrs}
        tgtCrs = "EPSG:4326"
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-pp-raw-pmtiles {
    type = CopyAction
    inputId = slv-tlm3d-pp
    outputId = gld-de-pp-raw-pmtiles
    transformers = [{
      type = SQLDfTransformer
      code = """
        select
          ST_Transform(ST_PointZ(x,y,z), '"""${parametersDE.defaultSrcCrs}"""', 'EPSG:4326') as geometry,
          concat(uuid_edge, '#', edge_idx) as token,
          position, uuid_edge, zoom,
          'pps' as layer
        from %{inputViewName} pp
      """
    }]
    breakDataFrameLineage = true
    metadata {
      feed = de-disabled
      description = "Creates a pmtiles file, around 5GB size, takes ~15min including upload to S3"
    }
  }

  load-gld-de-pp {
    type = CustomDataFrameAction
    inputIds = [slv-pp, slv-de-pp-mapping-osm, slv-${parametersDE.topology}-pp]
    outputIds = [gld-de-pp]
    transformers = [{
      type = SQLDfsTransformer
      code {
        gld-de-pp = """
          select
            ST_PointZ(pp.x,pp.y,pp.z) as geometry,
            pp.id_positionpoint, pp.token, pp.zoom,
            ppm.uuid_edge, ppm.position, ppm.direction,
            org.azimuth,
            org.radius * ppm.direction as radius,
            org.grade * ppm.direction as grade,
            org.tags
          from %{inputViewName_slv-pp} pp
          join %{inputViewName_slv-de-pp-mapping-osm} ppm using (id_positionpoint, zoom)
          left join %{inputViewName_slv-"""${parametersDE.topology}"""-pp} org using (uuid_edge, edge_idx)
        """
      }
    }]
    breakDataFrameLineage = true
    metadata {
      feed = de
    }
  }

  load-gld-de-pp-pmtiles {
    type = CustomDataFrameAction
    inputIds = [slv-pp, slv-de-pp-mapping-osm, slv-${parametersDE.topology}-pp]
    outputIds = [gld-de-pp-pmtiles]
    transformers = [{
      type = SQLDfsTransformer
      code {
        gld-de-pp-pmtiles = """
          select
            ST_PointZ(pp.lng,pp.lat,pp.z) as geometry,
            pp.id_positionpoint, pp.token, pp.zoom,
            ppm.uuid_edge, ppm.position, ppm.direction,
            org.azimuth,
            org.radius * ppm.direction as radius,
            org.grade * ppm.direction as grade,
            org.tags,
            'pps' as layer
          from %{inputViewName_slv-pp} pp
          join %{inputViewName_slv-de-pp-mapping-osm} ppm using (id_positionpoint, zoom)
          left join %{inputViewName_slv-"""${parametersDE.topology}"""-pp} org using (uuid_edge, edge_idx)
          where """${env.ppPmtilesFilter}"""
        """
      }
    }]
    breakDataFrameLineage = true
    metadata {
      feed = de
      description = """
        Creates a pmtiles file, around 5GB size if not filtered.
        Creating this file format uses most of the time of the pipeline, 15min for whole CH.
      """
    }
  }


}