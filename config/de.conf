// chosen parameter config in global.conf!
parametersDE {
  countryCode = "de"
  defaultSrcCrs = "EPSG:25832" # UTM zone 32N, good for metric calculations in Germany
  topology = "osm"
  osmConfig {
    region = "germany"
    lineExtract = {
      #operators = "DB"
      #linesToExclude = "300,302"
    }
    nbOfPartitions = 200
  }
}

dataObjects {

  slv-de-pp-mapping-osm = ${templates.slvTable} {
    allowSchemaEvolution = true
    table.name = de_pp_mapping_osm
  }

  slv-de-pp-mapping-osm-hist = ${templates.slvTable} {
    table = {
      name = de_pp_mapping_osm_hist
      primaryKey = [id_positionpoint, uuid_edge]
    }
  }

  gld-de-edge = {
    type = RawFileDataObject
    path = ${env.dataPath}"/gld/de-edge"
    customFormat = geoparquet
  }

  gld-de-edge-fgb = {
    type = net.mars.open.pp.FlatGeobufDataObject
    localPath = ${env.dataPath}"/gld/geometries/de-edges.fgb"
    path = ${env.geometriesPath}"/de-edges.fgb"
    colsToIgnore = [tracks]
    ogr2OgrFix = true # otherwise error "start offset of Float64Array should be a multiple of 8" might occur in JS clients...
  }

  gld-de-node = {
    type = RawFileDataObject
    path = ${env.dataPath}"/gld/de-node"
    customFormat = geoparquet
  }

  gld-de-node-fgb = {
    type = net.mars.open.pp.FlatGeobufDataObject
    localPath = ${env.dataPath}"/data/gld/geometries/de-nodes.fgb"
    path = ${env.geometriesPath}"/de-nodes.fgb"
    geometryType = Point
    #idColName = uuid_node # doesnt work in version 33.1, lets put it as attribute
    colsToIgnore = [edges]
    ogr2OgrFix = true # otherwise error "start offset of Float64Array should be a multiple of 8" might occur in JS clients...
  }

  gld-de-pp-raw-pmtiles = {
    type = net.mars.open.pp.PMTilesDataObject
    localPath = ${env.dataPath}"/gld/geometries/de-pp-raw.pmtiles"
    path = ${env.geometriesPath}"/de-pp-raw.pmtiles"
    compressTiles = false
    zoomAndFilter = {
      15 = "zoom <= 1"
      18 = "zoom <= 2"
      21 = "zoom <= 3"
    }
  }

  gld-de-pp = {
    type = RawFileDataObject
    path = ${env.dataPath}"/gld/de-pp"
    customFormat = geoparquet
  }

  gld-de-pp-pmtiles = {
    type = net.mars.open.pp.PMTilesDataObject
    localPath = ${env.dataPath}"/gld/geometries/de-pp.pmtiles"
    path = ${env.geometriesPath}"/de-pp.pmtiles"
    tempCalculationPath = ${env.dataPath}"/temp/de-pp-pmtiles-prep"
    compressTiles = false # doesnt work yet with maplibre :-(
    zoomAndFilter = {
      15 = "zoom <= 1"
      18 = "zoom <= 2"
      21 = "zoom <= 3"
    }
  }

}

actions {

  create-slv-de-pp {
    type = CustomDataFrameAction
    inputIds = [slv-osm-pp]
    outputIds = [slv-pp, slv-de-pp-mapping-osm]
    recursiveInputIds = [slv-pp]
    transformers = [{
      type = ScalaClassSparkDfsTransformer
      className = net.mars.open.pp.SnapPpTransformer
      options = {
        srcCrs = ${parametersDE.defaultSrcCrs}
        nbOfPartitions = ${?parameters.osmConfig.nbOfPartitions}
        # stuttgart - use x/y coordinates, e.g lon/lat!
        polygonCoordsFilter = "[[7.0809114235,47.1672235343],[10.5442939657,47.1672235343],[10.5442939657,49.108060036],[7.0809114235,49.108060036],[7.0809114235,47.1672235343]]"
      }
      renamedInputIds = {
        slv-pp: pp-existing
        slv-osm-pp: pp-new
      }
      renamedOutputIds = {
        slv-pp-mapping: slv-de-pp-mapping-osm
      }
    }, {
      type = SQLDfsTransformer
      code {
        slv-de-pp-mapping-osm = """
          select
            pp.id_positionpoint, pp.zoom,
            ppm.uuid_edge, ppm.position, ppm.direction, edge_idx,
            org.radius * ppm.direction as radius,
            org.grade * ppm.direction as grade,
            org.tags,
            org.properties
          from %{inputViewName_slv-pp} pp
          join %{inputViewName_slv-de-pp-mapping-osm} ppm using (id_positionpoint)
          join %{inputViewName_slv-osm-pp} org using (uuid_edge, edge_idx)
        """
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  historize-slv-de-pp-mapping {
    type = HistorizeAction
    inputId = slv-de-pp-mapping-osm
    outputId = slv-de-pp-mapping-osm-hist
    mergeModeEnable = true
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-edge {
    type = CopyAction
    inputId = slv-osm-edge
    outputId = gld-de-edge
    transformers = [{
      type = SQLDfTransformer
      code = """
        select uuid_edge, geometry, uuid_node_from, uuid_node_to, src_id_node_from, src_id_node_to, tags, properties
        from %{inputViewName}
      """
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-node {
    type = CopyAction
    inputId = slv-osm-node
    outputId = gld-de-node
    transformers = [{
      type = SQLDfTransformer
      code = """
        select uuid_node, geometry, arity, switch_type, tags, properties, src_id
        from %{inputViewName}
      """
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-edge-fgb {
    type = CopyAction
    inputId = gld-de-edge
    outputId = gld-de-edge-fgb
    transformers = [{
      type = SQLDfTransformer
      code = """
        select uuid_edge, geometry, uuid_node_from, uuid_node_to,
          tags, properties.op, properties.line, properties.track, properties.speed
        from %{inputViewName}
      """
    }, {
      type = ScalaClassSparkDfTransformer
      className = net.mars.open.pp.CrsTransformer
      options {
        srcCrs = ${parametersDE.defaultSrcCrs}
        tgtCrs = "EPSG:4326"
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-node-fgb {
    type = CopyAction
    inputId = gld-de-node
    outputId = gld-de-node-fgb
    transformers = [{
      type = SQLDfTransformer
      code = """
        select uuid_node, geometry, arity, switch_type,
          tags, properties.nb, properties.radius, properties.turnout_side, properties.maxspeed_diverging, properties.maxspeed_straight
        from %{inputViewName}
      """
    }, {
      type = ScalaClassSparkDfTransformer
      className = net.mars.open.pp.CrsTransformer
      options {
        srcCrs = ${parametersDE.defaultSrcCrs}
        tgtCrs = "EPSG:4326"
      }
    }]
    breakDataFrameLineage = true
    metadata.feed = de
  }

  load-gld-de-pp {
    type = CustomDataFrameAction
    inputIds = [slv-pp, slv-de-pp-mapping-osm]
    outputIds = [gld-de-pp]
    transformers = [{
      type = SQLDfsTransformer
      code {
        gld-de-pp = """
          select
            ST_Point(x,y) as geometry,
            id_positionpoint, token, pp.zoom, level, azimuth, h3id,
            lng, lat,
            uuid_edge, position, direction,
            radius, grade,
            tags, properties
          from %{inputViewName_slv-pp} pp
          join %{inputViewName_slv-de-pp-mapping-osm} ppm using (id_positionpoint)
        """
      }
    }]
    breakDataFrameLineage = true
    metadata {
      feed = de
    }
  }

  load-gld-de-pp-pmtiles {
    type = CopyAction
    inputId = gld-de-pp
    outputId = gld-de-pp-pmtiles
    transformers = [{
      type = SQLDfTransformer
      code = """
        select
          ST_Point(lng,lat) as geometry,
          id_positionpoint, token, zoom, level, azimuth, h3id,
          uuid_edge, position, direction,
          radius, grade,
          tags, properties.op, properties.line, properties.track, properties.speed,
          'pps' as layer
        from %{inputViewName}
        where """${env.ppPmtilesFilter}"""
      """
    }]
    breakDataFrameLineage = true
    metadata {
      feed = de
      description = """
        Creates a pmtiles file.
      """
    }
  }

}