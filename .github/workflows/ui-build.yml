name: Build, Run and Deploy UI

on:
  push:
    paths-ignore:
      - 'viz/state/**'
      - 'viz/schema/**'
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run every Monday at 5:00
  schedule:
    - cron: '0 5 * * 1'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: write
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_run:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven-

    - name: Config & tools
      run: |
        echo JAVA_OPTIONS="-Xmx8g -Dlog4j.configurationFile=src/test/resources/log4j2.yml --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y gdal-bin
        ogr2ogr --version

    - name: Build
      run: mvn -B clean package

    - name: Run pp generation
      env:
        S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      run: mvn -B exec:exec -Dexec.executable="java" -Dexec.args="$JAVA_OPTIONS -cp %classpath io.smartdatalake.app.DefaultSmartDataLakeBuilder --feed-sel tlm3d-ext,tlm3d,pp,ch --config ./config,./envConfig/ci.conf --state-path viz/state -n create-pp --parallelism 2"

    - name: Run Schema and Column Lineage export
      # A dry-run exports the schemas, merged with the @column descriptions of global.descriptionPath,
      # and the column lineage of all output DataObjects to global.dataObjectsSchemaSource.
      env:
        S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        SDLB_SCHEMA_SOURCE: "localfile:viz/schema"
      run: |
        mkdir -p viz/schema
        mvn -B exec:exec -Dexec.executable="java" -Dexec.args="$JAVA_OPTIONS -cp %classpath io.smartdatalake.app.DefaultSmartDataLakeBuilder --feed-sel tlm3d-ext,tlm3d,pp,ch --config ./config,./envConfig/ci.conf -n create-pp --test dry-run-with-lineage-export"

    - name: Run Statistics export
      # The dry-run exports no statistics, so CatalogStatsExporter adds them.
      env:
        S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      run: mvn -B exec:exec -Dexec.executable="java" -Dexec.args="$JAVA_OPTIONS -cp %classpath io.smartdatalake.meta.configexporter.CatalogStatsExporter --config ./config,./envConfig/ci.conf --target localfile:viz/schema"

    - name: Git Config
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Commit and Push New State, Schema, Lineage and Statistics Files
      run: |
        git pull
        git add viz/state/
        git add -A viz/schema/
        git diff-index --quiet HEAD || git commit -m "Update state, schema, lineage and statistics files" # only if there is something to commit
        git push

    - name: Run Export config with additional documentation
      # ConfigJsonExporter was replaced by ExportSync in SDLB 3. Descriptions are read from global.descriptionPath.
      # The localfile: scheme writes viz/exportedConfig.json as a single file where the UI expects it.
      env:
        S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      run: mvn -B exec:exec -Dexec.executable="java" -Dexec.args="$JAVA_OPTIONS -cp %classpath io.smartdatalake.meta.configexporter.ExportSync --config ./config,./envConfig/ci.conf --target localfile:./viz --types configJson"

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Download and Unzip Latest UI Snapshot
      run: wget https://nightly.link/smart-data-lake/sdl-visualization/workflows/build/develop/sdl-visualizer.zip && unzip -n sdl-visualizer.zip -d ./viz

    - name: Run build_index.sh script to create state index
      run: |
          chmod +x ./build_index.sh  
          ./build_index.sh ./state
      working-directory: viz/

    - name: Remove .venv Folder
      run: rm -rf viz/.venv/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        # Upload visualizer directory
        path: 'viz'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
